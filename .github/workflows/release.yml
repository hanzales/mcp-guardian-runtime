name: Prepare NuGet Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to prepare
        required: true
        default: 0.1.0-preview.1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore McpGuardian.Runtime.slnx --configfile NuGet.config
      - run: dotnet build McpGuardian.Runtime.slnx -c Release --no-restore -p:Version=${{ inputs.version }}
      - run: dotnet test McpGuardian.Runtime.slnx -c Release --no-build --no-restore
      - run: dotnet pack src/McpGuardian.Runtime/McpGuardian.Runtime.csproj -c Release --no-build -p:Version=${{ inputs.version }} -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: McpGuardian.Runtime-${{ inputs.version }}
          path: artifacts/packages/*.*nupkg

      # Publishing is intentionally absent. Download and inspect the artifact,
      # then add trusted publishing only after explicit authorization.
