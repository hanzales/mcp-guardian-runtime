name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore McpGuardian.Runtime.slnx --configfile NuGet.config
      - run: dotnet build McpGuardian.Runtime.slnx -c Release --no-restore
      - run: dotnet test McpGuardian.Runtime.slnx -c Release --no-build --no-restore
      - run: dotnet pack src/McpGuardian.Runtime/McpGuardian.Runtime.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
